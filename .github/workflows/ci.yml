name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "8.3"
            laravel: "12"
          - php: "8.4"
            laravel: "12"
          - php: "8.5"
            laravel: "12"
          - php: "8.3"
            laravel: "13"
          - php: "8.4"
            laravel: "13"
          - php: "8.5"
            laravel: "13"

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
          extensions: mbstring, dom, sqlite, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      - name: Install dependencies (lock file; Laravel 13 by default)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Resolve to Laravel ${{ matrix.laravel }} for this matrix cell
        if: matrix.laravel == '12'
        run: |
          composer update \
            illuminate/contracts:^12.0 \
            illuminate/database:^12.0 \
            illuminate/support:^12.0 \
            orchestra/testbench:^10.11 \
            --with-all-dependencies \
            --no-interaction \
            --no-progress

      - name: Validate composer.json
        run: composer validate --strict

      - name: Security audit (Composer)
        run: composer audit --no-interaction

      - name: Coding style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan/Larastan)
        run: vendor/bin/phpstan analyse

      - name: Tests (Pest)
        run: vendor/bin/pest

  coverage:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP (coverage)
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: pcov
          extensions: mbstring, dom, sqlite, pdo_sqlite

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-8.3-laravel-13-coverage-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-laravel-13-coverage-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coverage (Pest)
        run: vendor/bin/pest --coverage --coverage-text
